# 量化方法匹配度 —— 分值唯一来源（工程匹配度，非 ΔNLL）
# 权威消费方：score_quant_methods.py
# 开发说明：skills/references/07-match-score-rubric.md
# 改分流程：改本文件 → 跑冒烟命令（见 07）→ 若改了 key 名再改脚本与 07
#
# 每条数字旁的「得分理由」说明：为何设这个量级、相对其它项如何排序。
# 改分时请同步改旁边注释，避免后人只看到数字不知道意图。

version: 1

score_clamp:
  # 最终展示用百分制，避免负分/超量干扰排序观感
  min: 0
  max: 100

gates:
  # 与 00「未适配 >500GB」超大门禁对齐：Dense 超此规模禁止走通用 llmc
  dense_ultra_gb: 500

# ---------------------------------------------------------------------------
# llmc_base：各 llmc 候选的固有起点（未加拓扑/权重/VL 等之前）
# 排序意图（高→低）：族模板 > FP8 通用首选 > W8 默认/覆盖 alg > W4 > 解包
# ---------------------------------------------------------------------------
llmc_base:
  # 族专属 YAML scheme 已绑定 arch，工程可行性高于「无依据地试用通用配方」
  family_scheme: 45

  # Dense 未适配常用首选方案：弱/免校准、路径成熟；略高于需校准的 W8 变体
  FP8_DYNAMIC: 40

  # W8A8 未指定 --alg → 默认 smoothquant_gptq；通用 INT8 主推，但 VL 上另有惩罚
  W8A8_default: 38

  # 显式 GPTQ：精度潜力通常最好，但更慢更吃显存 → base 略低于「默认 W8」以免无条件时总排序高于默认
  W8A8_gptq: 36

  # 显式 PTQ：稳、无 Smooth；精度一般弱于 GPTQ → 低于 gptq
  W8A8_ptq: 32

  # model_free：快、免校准，但精度与路径约束（相对路径）更弱 → 再低一档
  W8A8_model_free_ptq: 30

  # W4 压缩压缩比更高、精度风险更大，未适配时不应排序高于 W8/FP8 首选方案
  W4A16: 28
  # AWQ 非对称对 mapping 更敏感 → 略低于对称 GPTQ W4
  W4A16_ASYM: 26

  # llmc 配方名 W4A8 ≠ MoE-Quant 档位；易误导且更难稳 → 明显压低
  W4A8: 18

  # 解包非量化；仅当源是 block FP8 才该高（由 weight 因子再拉高）
  FP8_TO_BF16: 15

factors:
  # -------------------------------------------------------------------------
  # topology：路径大类是否对味（对齐 00 F1 Dense→llmc / F2 MoE→examples）
  # -------------------------------------------------------------------------
  topology:
    # Dense 走 llmc 是默认正确大类，给稳定正分
    dense_llmc: 20
    # MoE 强制套用通用 llmc 常失败或次优：须显著扣分，使 examples/MoE-Quant 排序优先
    moe_llmc: -25
    # MoE 且 examples 强命中：应优先于通用 llmc
    moe_examples_strong: 15
    # Dense 近亲 examples：可加分，幅度须低于 Dense→llmc 主路径主导权重
    dense_examples_strong: 5

  # -------------------------------------------------------------------------
  # weight：源权重形态与 scheme 输入是否一致
  # -------------------------------------------------------------------------
  weight:
    # BF16/FP16 是通用 FP8/W8/W4 scheme 的预期输入
    bf16_generic_match: 15
    # 源已是 block FP8 且走解包：强匹配，应明显高于「错把 FP8 当 BF16 量化」
    block_fp8_unpack_match: 25
    # 源 block FP8 却套 BF16 量化配方：易错，中等惩罚
    block_fp8_generic_mismatch: -20
    # 源已是 W4 再套通用 int8/fp8：可能不适用，轻于族模板错配
    w4_as_bf16_scheme: -10

  # -------------------------------------------------------------------------
  # size：规模是否落在 llmc 允许门内
  # -------------------------------------------------------------------------
  size:
    # 在 gate 内给小幅加分，鼓励标规模；未知规模不加不减（脚本逻辑）
    llmc_within_gate: 10

  # -------------------------------------------------------------------------
  # vl：脚本 is_vl=true 时（多见嵌套 language_model.* / vision_config）
  # 针对「默认 SmoothQuant mapping」风险，不绑定某一具体权重目录名
  # 惩罚须大到：未改 alg 的默认 W8A8 < 显式 gptq/ptq
  # -------------------------------------------------------------------------
  vl:
    # 未改 alg 的 W8A8/W4A8/W4AFP8：默认 Smooth mapping 易失败 → 重罚
    smooth_default_penalty: -30
    # 显式 gptq：同档修复
    gptq_bonus: 15
    # ptq：避开 Smooth；相对 gptq 加成略低
    ptq_bonus: 10
    # model_free：避开 Smooth；相对路径等约束见 03
    model_free_bonus: 8

  # -------------------------------------------------------------------------
  # history：已有量化历史时，通用 llmc 只作为辅助对照，避免覆盖历史菜单优先级
  # -------------------------------------------------------------------------
  history:
    llmc_side_evidence: -5

  # -------------------------------------------------------------------------
  # family：quant_templates 族 scheme
  # -------------------------------------------------------------------------
  family:
    # 源形态与模板假设严重矛盾（如 BF16 却用 DeepSeek FP8→*）→ 接近硬否决量级
    weight_mismatch: -40
    # arch 命中 YAML 条目：强工程信号
    yaml_hit: 25

  # -------------------------------------------------------------------------
  # examples：强命中起始 ≈90；弱命中（仅同 family）约 35，避免 Qwen2.5-VL 误推 Qwen3.8 脚本
  # -------------------------------------------------------------------------
  examples:
    # 近亲脚本：仓库已验证过类似结构，起点应高于任意通用 llmc base
    strong_base: 55
    strong_hit: 35          # 起始分 = strong_base + strong_hit (=90)
    # 仅族名相近：辅助对照，不得当历史配方
    weak_base: 25
    weak_family_only: 10    # 起始分 = weak_base + weak_family_only (=35)
    # 强命中且声明有历史：小幅再抬，仍 cap 在 score_clamp.max
    history_boost: 5

  # -------------------------------------------------------------------------
  # autoquantize：MoE 无强 examples 时的标准升级入口（00 F2）
  # -------------------------------------------------------------------------
  autoquantize:
    # 可行但贵（分析+落地脚本），中等起点
    base: 50
    # registry 已能接 MoE-Quant 时，说明后续还有升级空间，略抬
    moe_adapter_bonus: 10

  # -------------------------------------------------------------------------
  # moe_quant：须 registry 命中；起始 base+registry≈75，与强 examples(~90) 拉开
  # -------------------------------------------------------------------------
  moe_quant:
    base: 40
    registry: 35            # 起始分 = base + registry (=75)
    # 有官方 run_*w4a8*.sh：可复现性更好
    run_script: 5
    # 非 MoE 拓扑却进 MoE-Quant：接近否决
    non_moe_topology: -40

# ---------------------------------------------------------------------------
# target_bonus：客户目标 bit/格式 与候选 kind 对齐
# 对齐 +15；轻微错配小扣；跨压缩档（如要 int8 却推 w4）多扣；auto 全体轻 +5 保持可比
# kind 取值：fp8 | int8 | w4 | w4a8 | unpack | mixed
# ---------------------------------------------------------------------------
target_bonus:
  # 未指定目标时略抬所有候选，避免「全 0 目标项」导致排序只看 base
  auto_neutral: 5

  fp8:
    fp8: 15       # 完全对齐
    int8: -5      # 同属常见部署，但不是客户点名的 FP8
    w4: -10       # 压缩档差大
    w4a8: -8
    unpack: 0     # 解包与目标正交，不奖不惩
    mixed: -5     # examples 混合方案，非纯 FP8

  int8:
    int8: 15
    fp8: -5
    w4: -10
    w4a8: -5      # 名称含 A8 但权重 W4，不完全是客户要的 INT8
    unpack: 0
    mixed: 0      # 混合里常含 INT8，中性

  w4:
    w4: 15
    w4a8: 8       # 相关且压缩比更高，正向但低于纯 W4A16
    int8: -8
    fp8: -8
    unpack: 0
    mixed: 5      # 混合 INT4+INT8 常服务 W4 诉求

  w4a8:
    w4a8: 15
    w4: 5         # 只有权 W4、激活非 A8，部分相关
    int8: -5
    fp8: -8
    unpack: 0
    mixed: 10     # examples/MoE 混合方案常贴近 W4A8 诉求
